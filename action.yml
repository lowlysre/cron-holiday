name: 'cron-holiday'
description: 'Prevents scheduled workflows from running on specified holidays.'
author: '@lowlydba'
branding:
  icon: 'calendar'
  color: 'gray-dark'

inputs:
  holidays:
    description: 'Comma-separated list of YYYY-MM-DD holiday dates (e.g., 2026-01-01,2026-07-03)'
    required: true
    default: '2026-01-01,2026-01-19,2026-02-16,2026-05-25,2026-06-19,2026-07-03,2026-09-07,2026-10-12,2026-11-11,2026-11-26,2026-12-25,2027-01-01,2027-01-18,2027-02-15,2027-05-31,2027-06-18,2027-07-05,2027-09-06,2027-10-11,2027-11-11,2027-11-25,2027-12-24,2027-12-31'

  timezone:
    description: 'IANA timezone (e.g., America/New_York). Defaults to UTC.'
    required: false
    default: 'UTC'

  fail-on-holiday:
    description: 'If true, the step will fail when today is a holiday.'
    required: false
    default: 'false'

outputs:
  on_holiday:
    description: 'true if today is a holiday, false otherwise'
    value: ${{ steps.check_holiday.outputs.on_holiday }}

runs:
  using: 'composite'
  steps:

    - shell: bash
      id: check_holiday
      env:
        INPUT_TIMEZONE: ${{ inputs.timezone }}
        INPUT_HOLIDAYS: ${{ inputs.holidays }}
        INPUT_FAIL: ${{ inputs.fail-on-holiday }}
      run: |
        bash "${GITHUB_ACTION_PATH}/check_holiday.sh" "$INPUT_TIMEZONE" "$INPUT_HOLIDAYS" "$INPUT_FAIL"
